":"uploaded","size":613,"digest":"sha256:b0b3ef059ab0d0608683db9fcba1fbdd5f6963ee7cb4f9b8ca0471dfd5dec5ce","download_count":1,"created_at":"2026-10-13T11:25:14Z","updated_at":"2026-10-13T11:25:14Z"},{"id":636814564,"node_id":"RA_kwDOTUmYAs4l9QTk","name":"source.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":10698695,"digest":"sha256:4a04a6827f421deac46abdb53286384eac697805a60b0f2ce2dbbd17bf704871","download_count":0,"created_at":"2026-10-13T11:25:15Z","updated_at":"2026-10-13T11:25:16Z"},{"id":636814581,"node_id":"RA_kwDOTUmYAs4l9QT1","name":"source.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:1766fe50424fd0f2bc860a095ef1c07e801fd87d6fa4e5c9875d60b2a393c19e","download_count":0,"created_at":"2026-10-13T11:25:15Z","updated_at":"2026-10-13T11:25:15Z"}],"body":"## Release Notes\n\n- News can be filtered by category. `C` in the News and Split views opens\n  a checklist of the feed's fourteen categories: `space` toggles one, `o`\n  keeps only the one under the cursor, `a` brings them all back and\n  `Enter` applies the choice. The server does the filtering, as it does\n  for the score, so a hidden category takes no slot on the page, and\n  applying a choice refetches the feed once. The panel title names what is left\n  (`without movers, other`). `news_categories` (only these) or\n  `news_exclude_categories` (all but these) in `[ui]` set the starting\n  choice. The trending scope is a curated top ten and is not filtered.\n- Every row of the news list names its category. Articles filed as \"other\"\n  used to leave the column blank, which on a ticker feed could be a third\n  of the rows or more, and some labels were cut to three letters (`reg`,\n  `geo`, `corp`). The column now spells them out and is as wide as the\n  longest label in the feed. The article card shows the full name.\n- The News footer shows `C category` in place of `r refresh` to stay\n  within 110 columns; `?` still lists every key.\n\n## Install alphai-tui 0.31.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/makeev/alphai-tui/releases/download/v0.31.0/alphai-tui-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/makeev/alphai-tui/releases/download/v0.31.0/alphai-tui-installer.ps1 | iex\"\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install makeev/tap/alphai-tui\n```\n\n## Download alphai-tui 0.31.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [alphai-tui-aarch64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.31.0/alphai-tui-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.31.0/alphai-tui-aarch64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.31.0/alphai-tui-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.31.0/alphai-tui-x86_64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-pc-windows-msvc.zip](https://github.com/makeev/alphai-tui/releases/download/v0.31.0/alphai-tui-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.31.0/alphai-tui-x86_64-pc-windows-msvc.zip.sha256) |\n| [alphai-tui-aarch64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.31.0/alphai-tui-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.31.0/alphai-tui-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [alphai-tui-x86_64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.31.0/alphai-tui-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.31.0/alphai-tui-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n\n\n"}
