":"uploaded","size":613,"digest":"sha256:de6581fcfdd311dcf9c1f33ea8f71fedf9672307a7451ecdfb84718fa5a38405","download_count":1,"created_at":"2026-09-17T04:19:21Z","updated_at":"2026-09-17T04:19:21Z"},{"id":569434583,"node_id":"RA_kwDOTUmYAs4h8OHX","name":"source.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":8076110,"digest":"sha256:777e1dda81754bd12bcecc1e484df52c6e364f28f1e91ce72cdcbd4a2e657e39","download_count":0,"created_at":"2026-09-17T04:19:21Z","updated_at":"2026-09-17T04:19:22Z"},{"id":569434582,"node_id":"RA_kwDOTUmYAs4h8OHW","name":"source.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:ef1773a99fd657897c26a01d2afb009ef7f5af7c4fda0da63f03d24dea88b9b7","download_count":0,"created_at":"2026-09-17T04:19:21Z","updated_at":"2026-09-17T04:19:21Z"}],"body":"## Release Notes\n\n- A bar is its interval at every width. A plot too narrow for the whole\n  window now shows its newest bars and counts the rest in the title, such\n  as `last 70 of 192 bars`, instead of merging bars into larger candles,\n  which the chart had done since its first version and 0.23.1 had only\n  labelled. The split view's half-width chart draws the same bars as the\n  chart view, fewer of them, and the price axis follows the bars on\n  screen. To see more of the window, widen the terminal or pick a coarser\n  interval with `t`.\n\n## Install alphai-tui 0.23.2\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/makeev/alphai-tui/releases/download/v0.23.2/alphai-tui-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/makeev/alphai-tui/releases/download/v0.23.2/alphai-tui-installer.ps1 | iex\"\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install makeev/tap/alphai-tui\n```\n\n## Download alphai-tui 0.23.2\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [alphai-tui-aarch64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.23.2/alphai-tui-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.23.2/alphai-tui-aarch64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.23.2/alphai-tui-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.23.2/alphai-tui-x86_64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-pc-windows-msvc.zip](https://github.com/makeev/alphai-tui/releases/download/v0.23.2/alphai-tui-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.23.2/alphai-tui-x86_64-pc-windows-msvc.zip.sha256) |\n| [alphai-tui-aarch64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.23.2/alphai-tui-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.23.2/alphai-tui-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [alphai-tui-x86_64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.23.2/alphai-tui-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.23.2/alphai-tui-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n\n\n"}
