e":"uploaded","size":613,"digest":"sha256:84c2318f8177367245ca814b184f7445282a2e245821921744b27380462a239d","download_count":1,"created_at":"2026-09-27T06:22:51Z","updated_at":"2026-09-27T06:22:51Z"},{"id":592302310,"node_id":"RA_kwDOTUmYAs4jTdDm","name":"source.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":8539421,"digest":"sha256:a3cb826aea9ae16046e11afb679a3af0afb848ef46285434626ee9e089cd58b6","download_count":0,"created_at":"2026-09-27T06:22:51Z","updated_at":"2026-09-27T06:22:51Z"},{"id":592302314,"node_id":"RA_kwDOTUmYAs4jTdDq","name":"source.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:d86e980a3482fcc90e07dd72e07176e8331de59886b45b64a724f24176f5f4da","download_count":0,"created_at":"2026-09-27T06:22:51Z","updated_at":"2026-09-27T06:22:51Z"}],"body":"## Release Notes\n\n- `a` and `d` save the watchlist to the config straight away, the way a\n  holding is saved. Before, an added ticker was gone on the next start\n  unless Save in the settings screen came first. A session started on\n  tickers from the command line leaves a saved watchlist alone, so that\n  `alphai-tui TSLA` and one keypress cannot replace it, and the footer says\n  the change was not saved.\n- `E` says why when it has nothing to draw: daily candles cover the regular\n  session only, crypto trades around the clock, pre and post market are\n  drawn for US listings only, and Finnhub has no candle history at all. On\n  Finnhub the chart title reads `EXT: n/a` instead of `EXT: no data`, which\n  looked like a gap the next poll might fill.\n- Daily charts on Alpaca's IEX feed draw the consolidated daily bars. IEX\n  is one exchange with a few percent of the tape, so its daily volume was\n  some thirty times too small (0.84M against 30.1M for AAPL on 25\n  September) and its high and low were one venue's. The current day keeps\n  its live IEX close. This costs one request per ticker a minute; if it is\n  refused, the chart keeps IEX's own bars and labels the volume `IEX only`\n  as before.\n- A notice in the footer, such as the one about switching to another price\n  source, now comes before the key hints for its minute on screen. Behind\n  them it started past column 95 and a common terminal cut it off.\n\n## Install alphai-tui 0.25.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/makeev/alphai-tui/releases/download/v0.25.0/alphai-tui-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/makeev/alphai-tui/releases/download/v0.25.0/alphai-tui-installer.ps1 | iex\"\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install makeev/tap/alphai-tui\n```\n\n## Download alphai-tui 0.25.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [alphai-tui-aarch64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.25.0/alphai-tui-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.25.0/alphai-tui-aarch64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.25.0/alphai-tui-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.25.0/alphai-tui-x86_64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-pc-windows-msvc.zip](https://github.com/makeev/alphai-tui/releases/download/v0.25.0/alphai-tui-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.25.0/alphai-tui-x86_64-pc-windows-msvc.zip.sha256) |\n| [alphai-tui-aarch64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.25.0/alphai-tui-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.25.0/alphai-tui-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [alphai-tui-x86_64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.25.0/alphai-tui-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.25.0/alphai-tui-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n\n\n"}
