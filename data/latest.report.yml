e":"uploaded","size":613,"digest":"sha256:de7b72fa821de5e1e3825d44168dcb5b374d11461241ec26f539b40b2d3f9b7e","download_count":1,"created_at":"2026-10-27T04:35:49Z","updated_at":"2026-10-27T04:35:49Z"},{"id":680451522,"node_id":"RA_kwDOTUmYAs4ojt3C","name":"source.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":10725587,"digest":"sha256:55a8e69c9095e1abd289402d723b012cb263c572181ce12df8eb929e9fb74210","download_count":0,"created_at":"2026-10-27T04:35:49Z","updated_at":"2026-10-27T04:35:50Z"},{"id":680451530,"node_id":"RA_kwDOTUmYAs4ojt3K","name":"source.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:e8932f6f729cc3dcae5ccf92e5c3f217d219ffba0c4ceabd07edee47a0a630e0","download_count":0,"created_at":"2026-10-27T04:35:49Z","updated_at":"2026-10-27T04:35:50Z"}],"body":"## Release Notes\n\n- Mouse support, on by default. A click on a header pill switches the\n  view; a click on a ticker in the quote rail, in the watchlist, on a\n  Summary card or on a Portfolio row selects it; a click on a news or\n  insider row selects it, and a second click on the same row opens its\n  card; a click on a row of the Split news strip opens the News view on\n  that article; a click on a Calendar row selects the event. The wheel\n  moves the cursor in lists and scrolls the article card, the earnings\n  read, the help and the settings. Inside the category picker a click\n  ticks a row, inside the ticker search it picks a result, and a click\n  outside the help or the article card closes it. The wheel never loads\n  another feed page and never changes the chart preset, so a trackpad\n  flick costs no requests.\n- `M` hands the mouse back to the terminal, which then selects text as\n  usual, and takes it again. The new **Mouse** row in settings does the\n  same and Save remembers it as `[ui] mouse = false`. The action is\n  `toggle_mouse` in `[keybindings]`.\n\n## Install alphai-tui 0.36.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/makeev/alphai-tui/releases/download/v0.36.0/alphai-tui-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/makeev/alphai-tui/releases/download/v0.36.0/alphai-tui-installer.ps1 | iex\"\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install makeev/tap/alphai-tui\n```\n\n## Download alphai-tui 0.36.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [alphai-tui-aarch64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.36.0/alphai-tui-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.36.0/alphai-tui-aarch64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.36.0/alphai-tui-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.36.0/alphai-tui-x86_64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-pc-windows-msvc.zip](https://github.com/makeev/alphai-tui/releases/download/v0.36.0/alphai-tui-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.36.0/alphai-tui-x86_64-pc-windows-msvc.zip.sha256) |\n| [alphai-tui-aarch64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.36.0/alphai-tui-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.36.0/alphai-tui-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [alphai-tui-x86_64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.36.0/alphai-tui-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.36.0/alphai-tui-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n\n\n"}
