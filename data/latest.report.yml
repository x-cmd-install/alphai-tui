":"uploaded","size":613,"digest":"sha256:34c29d891b9baf2a62fdd3173d7d6a8e16b9aff47b959aaad3cef4d87c645bd4","download_count":2,"created_at":"2026-10-16T17:34:34Z","updated_at":"2026-10-16T17:34:35Z"},{"id":648077924,"node_id":"RA_kwDOTUmYAs4moOJk","name":"source.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":10710544,"digest":"sha256:39caf7ff9ebdad24c4275594b3ec6c9467fbf05f9ec00b063d4b2b3d8cdae140","download_count":0,"created_at":"2026-10-16T17:34:34Z","updated_at":"2026-10-16T17:34:35Z"},{"id":648077936,"node_id":"RA_kwDOTUmYAs4moOJw","name":"source.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:9e3f29c8e1b86a3e6f095fa10b585c7889986dff8daed45c4fc05a432a65bd93","download_count":0,"created_at":"2026-10-16T17:34:35Z","updated_at":"2026-10-16T17:34:35Z"}],"body":"## Release Notes\n\n- `/` finds a watchlist ticker from any view.\n  Type part of its symbol or company name, move with the arrow keys and\n  press Enter to select it; Esc leaves the ticker and reading position\n  alone. Exact symbols come first, then prefixes and other matches. The\n  results show regular-session quotes, daily changes and cached or stale\n  labels where needed. Company names come with Yahoo quotes and survive\n  in the quote cache; other sources can still be searched by symbol.\n  Searching adds no requests and does not edit the saved watchlist.\n  Portfolio selects the matching holding, or opens the chart if it is not held.\n  The opening key can be changed with `find_ticker` in `[keybindings]`.\n- Split gives the chart 70% of the height, with the watchlist and news\n  sharing the remaining 30% below it.\n- Update the locked transitive `chacha20` dependency from the yanked\n  0.10.1 release to 0.10.2, removing the packaging warning.\n\n## Install alphai-tui 0.34.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/makeev/alphai-tui/releases/download/v0.34.0/alphai-tui-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/makeev/alphai-tui/releases/download/v0.34.0/alphai-tui-installer.ps1 | iex\"\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install makeev/tap/alphai-tui\n```\n\n## Download alphai-tui 0.34.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [alphai-tui-aarch64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.34.0/alphai-tui-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.34.0/alphai-tui-aarch64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.34.0/alphai-tui-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.34.0/alphai-tui-x86_64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-pc-windows-msvc.zip](https://github.com/makeev/alphai-tui/releases/download/v0.34.0/alphai-tui-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.34.0/alphai-tui-x86_64-pc-windows-msvc.zip.sha256) |\n| [alphai-tui-aarch64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.34.0/alphai-tui-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.34.0/alphai-tui-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [alphai-tui-x86_64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.34.0/alphai-tui-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.34.0/alphai-tui-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n\n\n"}
