e":"uploaded","size":613,"digest":"sha256:ddd7cf14c048af8050be55912e95558c2fb362e18ab9f41491799103758db7dc","download_count":2,"created_at":"2026-11-22T07:47:56Z","updated_at":"2026-11-22T07:47:57Z"},{"id":778304435,"node_id":"RA_kwDOTUmYAs4uY_uz","name":"source.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":12342069,"digest":"sha256:6a0f744fec9178e1a1a42555b6725a32f6413842eb9159f990fbd5b9aa41dabb","download_count":1,"created_at":"2026-11-22T07:47:57Z","updated_at":"2026-11-22T07:47:57Z"},{"id":778304456,"node_id":"RA_kwDOTUmYAs4uY_vI","name":"source.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:850e7ed8e2974d7b0c4440fc73d9fb382c820cb9c7bbca7aaac8f40762e69954","download_count":1,"created_at":"2026-11-22T07:47:57Z","updated_at":"2026-11-22T07:47:57Z"}],"body":"## Release Notes\n\n- Import portfolio holdings with `--import-positions FILE`. It reads IBKR\n  Activity Statement, Flex Query and generic positions CSV exports. Add\n  `--dry-run` to preview the changes. Existing holdings absent from the file\n  stay in the portfolio.\n- `--hide-source` (or `ALPHAI_TUI_HIDE_SOURCE=1`) leaves the price\n  source's name off the screen: the header, the quote rail and the chart's\n  feed labels. Market feeds (IEX, SIP) still show, and so does the settings\n  screen, where the source is chosen. Meant for screenshots and recordings.\n- The README images are shot with it.\n\n## Install alphai-tui 0.44.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/makeev/alphai-tui/releases/download/v0.44.0/alphai-tui-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/makeev/alphai-tui/releases/download/v0.44.0/alphai-tui-installer.ps1 | iex\"\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install makeev/tap/alphai-tui\n```\n\n## Download alphai-tui 0.44.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [alphai-tui-aarch64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.44.0/alphai-tui-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.44.0/alphai-tui-aarch64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.44.0/alphai-tui-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.44.0/alphai-tui-x86_64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-pc-windows-msvc.zip](https://github.com/makeev/alphai-tui/releases/download/v0.44.0/alphai-tui-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.44.0/alphai-tui-x86_64-pc-windows-msvc.zip.sha256) |\n| [alphai-tui-aarch64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.44.0/alphai-tui-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.44.0/alphai-tui-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [alphai-tui-x86_64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.44.0/alphai-tui-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.44.0/alphai-tui-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n\n\n"}
