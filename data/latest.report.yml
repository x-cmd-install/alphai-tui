":"uploaded","size":613,"digest":"sha256:277f9f47b3848e3134e13c13a4c924b2162ac2518aa5e8e81daa2d461b9030fc","download_count":1,"created_at":"2026-09-30T06:05:26Z","updated_at":"2026-09-30T06:05:26Z"},{"id":600173999,"node_id":"RA_kwDOTUmYAs4jxe2v","name":"source.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":10658646,"digest":"sha256:fada4eea6f1a017dd8720495df184bc32d65dd1ef38e1d10d8a507268e01f683","download_count":0,"created_at":"2026-09-30T06:05:26Z","updated_at":"2026-09-30T06:05:27Z"},{"id":600173996,"node_id":"RA_kwDOTUmYAs4jxe2s","name":"source.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:c08400079a4df16f666e28a729e225d38c5d49424d2d31a0ecae725effff487b","download_count":0,"created_at":"2026-09-30T06:05:26Z","updated_at":"2026-09-30T06:05:27Z"}],"body":"## Release Notes\n\n- Tiingo is a fourth price source: `-s tiingo`, a key row in the settings\n  screen, `[keys] tiingo` or `TIINGO_API_KEY`. Quotes and intraday bars\n  come from IEX in real time, pre and post market included from 08:00 to\n  17:30 ET. Daily charts use Tiingo's consolidated end-of-day history with\n  the whole market's volume, and crypto works as `BTC-USD`. One request per\n  poll quotes the whole watchlist; bars and daily history are cached, and\n  the live price moves the last candle between refreshes. The free plan's\n  50 requests an hour suit a couple of tickers polled every few minutes; a\n  paid plan covers a live dashboard. The README explains how the IEX\n  reference price and IEX's volume are shown.\n\n## Install alphai-tui 0.27.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/makeev/alphai-tui/releases/download/v0.27.0/alphai-tui-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/makeev/alphai-tui/releases/download/v0.27.0/alphai-tui-installer.ps1 | iex\"\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install makeev/tap/alphai-tui\n```\n\n## Download alphai-tui 0.27.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [alphai-tui-aarch64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.27.0/alphai-tui-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.27.0/alphai-tui-aarch64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.27.0/alphai-tui-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.27.0/alphai-tui-x86_64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-pc-windows-msvc.zip](https://github.com/makeev/alphai-tui/releases/download/v0.27.0/alphai-tui-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.27.0/alphai-tui-x86_64-pc-windows-msvc.zip.sha256) |\n| [alphai-tui-aarch64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.27.0/alphai-tui-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.27.0/alphai-tui-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [alphai-tui-x86_64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.27.0/alphai-tui-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.27.0/alphai-tui-x86_64-unkn