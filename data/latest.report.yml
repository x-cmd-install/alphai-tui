size":613,"digest":"sha256:e35893b3f8beb071dc4725c4043b80088253139438d3beb0813c041a2bc3d835","download_count":2,"created_at":"2026-11-25T08:30:57Z","updated_at":"2026-11-25T08:30:58Z"},{"id":790723293,"node_id":"RA_kwDOTUmYAs4vIXrd","name":"source.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":12362020,"digest":"sha256:a8de64364cf32acd31fd2bbd7a850fb482c09286a8739808894c75a505f73cc1","download_count":1,"created_at":"2026-11-25T08:30:57Z","updated_at":"2026-11-25T08:30:58Z"},{"id":790723308,"node_id":"RA_kwDOTUmYAs4vIXrs","name":"source.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:1bbd5f14cbb99d6027c41b04f592d64e4c1dc1223ea88e53148942317a2e133c","download_count":1,"created_at":"2026-11-25T08:30:58Z","updated_at":"2026-11-25T08:30:58Z"}],"body":"## Release Notes\n\n- `--doctor` checks what the app depends on and prints one line per\n  finding: the config file, every key and where it came from, one fetch\n  from each price source with a key plus Yahoo (with the key's minute\n  budget on Alpaca and Finnhub), the AlphAI plan and what is left of its\n  day, the quote cache, the terminal and whether a newer release is out.\n  Keys are masked and the home directory shows as `~`, so the report can\n  be pasted into an issue as it is. The exit code is 1 when a check fails.\n- An AlphAI rate limit message names your plan's limits instead of always\n  quoting the Free plan's.\n\n## Install alphai-tui 0.45.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/makeev/alphai-tui/releases/download/v0.45.0/alphai-tui-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/makeev/alphai-tui/releases/download/v0.45.0/alphai-tui-installer.ps1 | iex\"\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install makeev/tap/alphai-tui\n```\n\n## Download alphai-tui 0.45.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [alphai-tui-aarch64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.45.0/alphai-tui-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.45.0/alphai-tui-aarch64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.45.0/alphai-tui-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.45.0/alphai-tui-x86_64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-pc-windows-msvc.zip](https://github.com/makeev/alphai-tui/releases/download/v0.45.0/alphai-tui-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.45.0/alphai-tui-x86_64-pc-windows-msvc.zip.sha256) |\n| [alphai-tui-aarch64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.45.0/alphai-tui-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.45.0/alphai-tui-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [alphai-tui-x86_64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.45.0/alphai-tui-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.45.0/alphai-tui-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n\n\n"}
