e":"uploaded","size":613,"digest":"sha256:189516c72f58c43492ba4c694e55213265f51cc02a7ebca5f1e2404cda5f6aba","download_count":1,"created_at":"2026-10-01T18:42:27Z","updated_at":"2026-10-01T18:42:27Z"},{"id":603894238,"node_id":"RA_kwDOTUmYAs4j_rHe","name":"source.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":10665017,"digest":"sha256:7dc5dd9038d9f2f9a52966559a5d3d6b0acc2949ae92225072acb6e2a3d690e1","download_count":0,"created_at":"2026-10-01T18:42:27Z","updated_at":"2026-10-01T18:42:27Z"},{"id":603894243,"node_id":"RA_kwDOTUmYAs4j_rHj","name":"source.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:47d222cddae0e162ae8f9688341c0216b74644384651664a2dfa2baf7c5cb3ae","download_count":0,"created_at":"2026-10-01T18:42:27Z","updated_at":"2026-10-01T18:42:27Z"}],"body":"## Release Notes\n\n- Separate the current quote from the last chart bar: the quote rail shows\n  the quote's currency, feed and trade time, while the chart names the last\n  bar's close, feed and start time. Price markers distinguish quotes,\n  extended trades and bar closes. The header focuses on navigation and\n  connection status; hiding the rail restores quote details in the chart.\n- News cards lead with the selected company's AI impact and explanation,\n  before the general summary and other companies. The selected company\n  stays visible even when it appears after several others in the analysis.\n- Calendar gives long event names more room and reserves stronger color\n  for the event and its importance. Status labels remain visible on narrow\n  terminals.\n- Insider filings use a ledger with transaction date, side, value, owner\n  and a plan flag. Cards lead with the company, owner and trade facts,\n  followed by a separately labelled AI interpretation. Unknown trade dates\n  stay unknown, and buy/sell labels follow the filing rather than sentiment.\n- Shorten the README, bring installation and quick start forward, and\n  collapse the screenshot galleries while keeping the configuration,\n  scripting examples and provider limitations available.\n\n## Install alphai-tui 0.29.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/makeev/alphai-tui/releases/download/v0.29.0/alphai-tui-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/makeev/alphai-tui/releases/download/v0.29.0/alphai-tui-installer.ps1 | iex\"\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install makeev/tap/alphai-tui\n```\n\n## Download alphai-tui 0.29.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [alphai-tui-aarch64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.29.0/alphai-tui-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.29.0/alphai-tui-aarch64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.29.0/alphai-tui-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.29.0/alphai-tui-x86_64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-pc-windows-msvc.zip](https://github.com/makeev/alphai-tui/releases/download/v0.29.0/alphai-tui-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.29.0/alphai-tui-x86_64-pc-windows-msvc.zip.sha256) |\n| [alphai-tui-aarch64-unkno