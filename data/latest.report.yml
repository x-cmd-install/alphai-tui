e":"uploaded","size":613,"digest":"sha256:b027c9d6a6ebefff4ea65489155d610da6170cd9a8d689177dda23dda9385f9a","download_count":1,"created_at":"2026-09-22T11:22:18Z","updated_at":"2026-09-22T11:22:18Z"},{"id":581243008,"node_id":"RA_kwDOTUmYAs4ipRCA","name":"source.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":8535337,"digest":"sha256:cfb96415110c26e6e90629ad5110daab54577b059625f695b68f432a330bf97b","download_count":0,"created_at":"2026-09-22T11:22:18Z","updated_at":"2026-09-22T11:22:19Z"},{"id":581243004,"node_id":"RA_kwDOTUmYAs4ipRB8","name":"source.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:9f9ce4203fb5447e16a46a8ddeefdc556a97ba857f8235f5149a6bbc35c7b913","download_count":0,"created_at":"2026-09-22T11:22:18Z","updated_at":"2026-09-22T11:22:18Z"}],"body":"## Release Notes\n\n- The `1mo / 60m` preset works on Yahoo again. Yahoo keeps bars finer than\n  an hour for 60 days and refused the three months the preset's indicator\n  warm-up asked for, ever since 0.23.0 started fetching hourly bars as half\n  hours. The request now asks for 59 trading days, which reaches about\n  twelve weeks back. On Alpaca the same request serves as the extended\n  hours fallback, so its refusal had also switched that fallback off for\n  two minutes at a time.\n- A preset or session change no longer redraws the bars already on screen\n  on the new window while the source answers. The chart keeps drawing the\n  rows it has on the window they were fetched for and names the one on its\n  way in the title, `loading 1mo / 60m` or `EXT: loading`, or says the\n  request failed once it has actually been refused. Switching extended\n  hours off takes effect at once. On Alpaca, which pages consolidated\n  history, the old rows had shown for a few seconds as 15m bars on an\n  hourly axis and then jumped.\n- Alpaca's extended hours candles arrive sooner after a refused request. An\n  answer that left the chart with nothing to draw is asked for again after\n  15 seconds instead of a minute, and a history walk that lost a page on\n  the way is walked again rather than marked complete, which had left the\n  older sessions without consolidated bars until a restart.\n\n## Install alphai-tui 0.24.1\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/makeev/alphai-tui/releases/download/v0.24.1/alphai-tui-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/makeev/alphai-tui/releases/download/v0.24.1/alphai-tui-installer.ps1 | iex\"\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install makeev/tap/alphai-tui\n```\n\n## Download alphai-tui 0.24.1\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [alphai-tui-aarch64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.24.1/alphai-tui-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.24.1/alphai-tui-aarch64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.24.1/alphai-tui-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.24.1/alphai-tui-x86_64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-pc-windows-msvc.zip](https://github.com/makeev/alphai-tui/releases/download/v0.24.1/alphai-tui-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.24.1/alphai-tui-x86_64-pc-windows-msvc.zip.sha256) |\n| [alphai-tui-aarch64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.24.1/alphai-tui-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.24.1/alphai-tui-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [alphai-tui-x86_64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.24.1/alphai-tui-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.24.1/alphai-tui-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n\n\n"}
