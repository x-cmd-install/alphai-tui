ate":"uploaded","size":613,"digest":"sha256:eff37da2a39662ed708e4c199231731b69b2aa33e83bd65b969089ec1bf0b493","download_count":2,"created_at":"2026-11-15T08:51:08Z","updated_at":"2026-11-15T08:51:09Z"},{"id":750396098,"node_id":"RA_kwDOTUmYAs4suiLC","name":"source.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":12153883,"digest":"sha256:59dbc1952711bf756917a84688732d2a60b8772268f9e956a205c53eb355b1d2","download_count":2,"created_at":"2026-11-15T08:51:08Z","updated_at":"2026-11-15T08:51:09Z"},{"id":750396106,"node_id":"RA_kwDOTUmYAs4suiLK","name":"source.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:c03025a463b0dd8509066986790c65e9ded11ef37ede91b50cde6329bf3bd4cf","download_count":1,"created_at":"2026-11-15T08:51:09Z","updated_at":"2026-11-15T08:51:09Z"}],"body":"## Release Notes\n\n- Panel titles are quieter. The current value of a choice (a scope, a\n  filter, a layout, the Form 4 window) is lit in the accent color instead\n  of on an accent fill; only the active tab and the chart's window keep a\n  fill. The chart's switches (`MA`, `RSI`, `vol`, `news`, `ext`) read on\n  by brightness and off by fading rather than as lit buttons. Keys keep\n  their plates, now in a softer shade than the cursor row.\n- The footer leaves out a key that a panel title on screen already shows\n  beside its choices, so it names only what no title does: quit, the views,\n  the arrows, the price alert, help and the view's own keys. A title too\n  narrow to show its key leaves the hint in the footer.\n- The panel the arrow keys move in (the watchlist, the News and Insider\n  feeds, the Portfolio table, the Calendar agenda) has its frame in the\n  accent color.\n- Pre-market and after-hours shading stops at the last bar: over a weekend\n  the right margin used to be shaded as Monday's pre-market. Volume, RSI\n  and the Summary cards carry the session as a band along their bottom row\n  instead of a full background.\n- `[ui] borders = \"none\"` draws each tinted panel half a cell past its\n  content with quadrant blocks, so text gets a margin and panels keep a\n  narrow gutter; titles sit on a tab of the panel's tint, and the panel the\n  arrows move in is edged with a thin accent line. The `default` theme,\n  which has no tint, keeps its blank gutter.\n- Two color presets: `aardvark-ink` and `aardvark-blue`, after the Aardvark\n  Ink and Aardvark Blue terminal palettes. `{` and `}` cycle through them,\n  `--theme aardvark-blue` picks one for a run.\n\n## Install alphai-tui 0.43.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/makeev/alphai-tui/releases/download/v0.43.0/alphai-tui-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/makeev/alphai-tui/releases/download/v0.43.0/alphai-tui-installer.ps1 | iex\"\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install makeev/tap/alphai-tui\n```\n\n## Download alphai-tui 0.43.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [alphai-tui-aarch64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.43.0/alphai-tui-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.43.0/alphai-tui-aarch64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.43.0/alphai-tui-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.43.0/alphai-tui-x86_64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-pc-windows-msvc.zip](https://github.com/makeev/alphai-tui/releases/download/v0.43.0/alphai-tui-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.43.0/alphai-tui-x86_64-pc-windows-msvc.zip.sha256) |\n| [alphai-tui-aarch64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.43.0/alphai-tui-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.43.0/alphai-tui-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [alphai-tui-x86_64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.43.0/alphai-tui-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.43.0/alphai-tui-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n\n\n"}
