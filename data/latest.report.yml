e":"uploaded","size":613,"digest":"sha256:59bc0be2a7ffdf3b0bfa3f44beaf259b712a0b3f8e0b11893438d2665cb8bb91","download_count":1,"created_at":"2026-09-17T10:47:11Z","updated_at":"2026-09-17T10:47:11Z"},{"id":570057558,"node_id":"RA_kwDOTUmYAs4h-mNW","name":"source.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":8530764,"digest":"sha256:07877f8adb08ee2ba4e7d99ff104b8592aab21b71edf618721e861be976ad167","download_count":0,"created_at":"2026-09-17T10:47:11Z","updated_at":"2026-09-17T10:47:11Z"},{"id":570057561,"node_id":"RA_kwDOTUmYAs4h-mNZ","name":"source.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:81f8ebfa31b323a09cdbc57cc23a4065b909e42bfbb88bac585394e5891b9916","download_count":0,"created_at":"2026-09-17T10:47:11Z","updated_at":"2026-09-17T10:47:11Z"}],"body":"## Release Notes\n\n- Add `9:Calendar`, combining US macro releases and confirmed watchlist\n  report dates, with countdowns, source links and a cursor that stays on\n  the selected event while new dates arrive. Dates without a time remain\n  dates in ET; estimated, postponed and cancelled events are labelled.\n- Show a fresh upcoming-event flag in the quote rail. A confirmed report\n  date for the selected ticker takes priority over macro releases.\n- Share one cached macro window across all views and check report dates\n  gradually while Calendar is open. Preserve successful rows on an update\n  failure, show partial progress, and pause the sweep on access/limit errors.\n  Calendar refresh retries missing, stale and failed dates while retaining\n  fresh successful company dates.\n- Document Calendar with a screenshot and refresh the chart screenshot\n  with daily candles, moving averages, volume and RSI.\n\n## Install alphai-tui 0.24.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/makeev/alphai-tui/releases/download/v0.24.0/alphai-tui-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/makeev/alphai-tui/releases/download/v0.24.0/alphai-tui-installer.ps1 | iex\"\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install makeev/tap/alphai-tui\n```\n\n## Download alphai-tui 0.24.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [alphai-tui-aarch64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.24.0/alphai-tui-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.24.0/alphai-tui-aarch64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.24.0/alphai-tui-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.24.0/alphai-tui-x86_64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-pc-windows-msvc.zip](https://github.com/makeev/alphai-tui/releases/download/v0.24.0/alphai-tui-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.24.0/alphai-tui-x86_64-pc-windows-msvc.zip.sha256) |\n| [alphai-tui-aarch64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.24.0/alphai-tui-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.24.0/alphai-tui-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [alphai-tui-x86_64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.24.0/alphai-tui-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.24.0/alphai-tui-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n\n\n"}
