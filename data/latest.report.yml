te":"uploaded","size":613,"digest":"sha256:73c1c90800691844fef4cb975c81229cd5c9a366a630a2bcbbd8dfca33f01728","download_count":2,"created_at":"2026-10-05T08:37:21Z","updated_at":"2026-10-05T08:37:21Z"},{"id":611987639,"node_id":"RA_kwDOTUmYAs4kejC3","name":"source.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":10680662,"digest":"sha256:4eb29142217f6c8c8156dd22584afcdb7a557ce4e6a5fc0cac2611be6805e4bc","download_count":0,"created_at":"2026-10-05T08:37:21Z","updated_at":"2026-10-05T08:37:21Z"},{"id":611987638,"node_id":"RA_kwDOTUmYAs4kejC2","name":"source.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:281c768907fb68d312705cac5a19414ad324f64c10da01d3f74d84a46097d66d","download_count":0,"created_at":"2026-10-05T08:37:21Z","updated_at":"2026-10-05T08:37:21Z"}],"body":"## Release Notes\n\n- Fade price colors over 900 ms without changing text weight or decoration,\n  and show a fixed-width ASCII indicator while requests are in progress.\n  The new Animations settings row previews and saves an off switch; ANSI\n  themes retain their own palette and use a brief color highlight.\n- Render on input, data and clock changes, with a frame limit during\n  effects and slower refresh activity. Idle screens no longer rebuild ten\n  times a second, and slow terminals skip missed animation frames.\n- Reserve space for changing quote values and session countdowns on wide\n  rails. Truncate headlines by display cells without splitting graphemes.\n  Settings keep the selected row visible even in small panes.\n- Use synchronized output only when the current Unix terminfo entry\n  advertises a compatible Sync capability. End each frame on render errors\n  and unwinding too; missing support keeps ordinary output. The file-only\n  `ui.synchronized_output` switch can disable the extension.\n\n## Install alphai-tui 0.30.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/makeev/alphai-tui/releases/download/v0.30.0/alphai-tui-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/makeev/alphai-tui/releases/download/v0.30.0/alphai-tui-installer.ps1 | iex\"\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install makeev/tap/alphai-tui\n```\n\n## Download alphai-tui 0.30.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [alphai-tui-aarch64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.30.0/alphai-tui-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.30.0/alphai-tui-aarch64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.30.0/alphai-tui-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.30.0/alphai-tui-x86_64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-pc-windows-msvc.zip](https://github.com/makeev/alphai-tui/releases/download/v0.30.0/alphai-tui-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.30.0/alphai-tui-x86_64-pc-windows-msvc.zip.sha256) |\n| [alphai-tui-aarch64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.30.0/alphai-tui-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.30.0/alphai-tui-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [alphai-tui-x86_64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.30.0/alphai-tui-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.30.0/alphai-tui-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n\n\n"}
