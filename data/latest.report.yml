":"uploaded","size":613,"digest":"sha256:33fa434b7940431cc4af37a9e0bface1d393d45aee7cc9ddeaed3ec8782d1564","download_count":2,"created_at":"2026-09-14T10:13:49Z","updated_at":"2026-09-14T10:13:49Z"},{"id":563131383,"node_id":"RA_kwDOTUmYAs4hkLP3","name":"source.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":8072080,"digest":"sha256:0c34760110929d42bdaa7306c3978fa79200f3049f83ba1ef70c32df931d64f8","download_count":0,"created_at":"2026-09-14T10:13:49Z","updated_at":"2026-09-14T10:13:50Z"},{"id":563131385,"node_id":"RA_kwDOTUmYAs4hkLP5","name":"source.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:8000939d47791494266edb6fe931322454bd6729515102a56c7f2e21f9702037","download_count":0,"created_at":"2026-09-14T10:13:49Z","updated_at":"2026-09-14T10:13:49Z"}],"body":"## Release Notes\n\n- Premarket and after-hours candles are enabled by default. Warm and cool\n  backgrounds distinguish them from regular trading across price, volume\n  and RSI, in both candle and line charts. `Shift+E` toggles them, with a\n  hint beside `EXT` that remains visible when the sessions are hidden and\n  follows custom keybindings.\n- Alpaca's IEX mode supplements extended trading with consolidated SIP\n  data delayed by 15 minutes, then Yahoo when SIP is unavailable or missing\n  the relevant session. Supplemental results are cached; failed refreshes\n  retain known data, and Yahoo rate limits pause its fallback requests.\n  The regular quote and regular candles retain their original feed.\n- Extended quotes carry their source, timestamp, age and reference close.\n  A zero-percent move remains visible, and a new premarket retires the\n  previous after-hours quote. Portfolio valuations and JSON use the same\n  validated price and reference; JSON includes the extended feed and session.\n- Charts now start at `5d / 15m`, the same full-history preset available\n  through `t` and `T`. The header shows both the history window and candle\n  size alongside the switch hint. Short intraday histories fill the plot\n  width instead of leaving a large empty area on the left. Explicit\n  `range`, `interval` and `[chart] extended_hours` settings still apply.\n- A shared time axis adds more clock labels, dates, opening and closing\n  markers and aligned vertical grid lines across all three chart panels.\n  US stocks default to New York time, with `local` and `utc` alternatives\n  under `[chart] timezone`. Session shading and the grid are configurable.\n- Session boundaries account for holidays, half days and daylight-saving\n  changes. Hourly and display aggregation keep different sessions and feeds\n  apart, and future time labels skip closed US sessions.\n- A live quote updates only its own candle interval, session and feed.\n  Late poll responses from an old chart selection are ignored, preventing\n  a regular close or an outdated fetch from overwriting extended history.\n\n## Install alphai-tui 0.23.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/makeev/alphai-tui/releases/download/v0.23.0/alphai-tui-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/makeev/alphai-tui/releases/download/v0.23.0/alphai-tui-installer.ps1 | iex\"\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install makeev/tap/alphai-tui\n```\n\n## Download alphai-tui 0.23.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [alphai-tui-aarch64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.23.0/alphai-tui-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.23.0/alphai-tui-aarch64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-apple-darwin.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.23.0/alphai-tui-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.23.0/alphai-tui-x86_64-apple-darwin.tar.xz.sha256) |\n| [alphai-tui-x86_64-pc-windows-msvc.zip](https://github.com/makeev/alphai-tui/releases/download/v0.23.0/alphai-tui-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.23.0/alphai-tui-x86_64-pc-windows-msvc.zip.sha256) |\n| [alphai-tui-aarch64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.23.0/alphai-tui-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.23.0/alphai-tui-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [alphai-tui-x86_64-unknown-linux-gnu.tar.xz](https://github.com/makeev/alphai-tui/releases/download/v0.23.0/alphai-tui-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/makeev/alphai-tui/releases/download/v0.23.0/alphai-tui-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n\n\n"}
